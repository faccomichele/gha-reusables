name: Cancel all PR jobs on PR Close

on:
  workflow_call:

permissions:
  actions: write
  contents: read

jobs:
  cancel_pr_jobs:
    name: Cancel All PR Jobs
    runs-on: ${{ vars.RUNNERS_AMD64 || 'ubuntu-latest' }}
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head_sha: context.payload.pull_request.head.sha
            });
            const mergedConcurrency = new Map();
            const usesMergedConcurrency = async (run) => {
              const key = `${run.path}@${run.head_sha}`;
              if (!mergedConcurrency.has(key)) {
                try {
                  const workflow = await github.rest.repos.getContent({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    path: run.path,
                    ref: run.head_sha
                  });
                  const content = Buffer.from(workflow.data.content, 'base64').toString();
                  let concurrencyIndent;
                  let hasMergedConcurrency = false;
                  for (const line of content.split(/\r?\n/)) {
                    if (!line.trim()) {
                      continue;
                    }
                    const indentation = line.search(/\S|$/);
                    if (/^\s*concurrency:\s*(?:#.*)?$/.test(line)) {
                      concurrencyIndent = indentation;
                    } else if (
                      concurrencyIndent !== undefined &&
                      indentation <= concurrencyIndent
                    ) {
                      concurrencyIndent = undefined;
                    } else if (
                      concurrencyIndent !== undefined &&
                      /^\s*group:\s*(?:merged|["']merged["'])(?:\s*#.*)?$/.test(line)
                    ) {
                      hasMergedConcurrency = true;
                      break;
                    }
                  }
                  mergedConcurrency.set(key, hasMergedConcurrency);
                } catch {
                  mergedConcurrency.set(key, false);
                }
              }
              return mergedConcurrency.get(key);
            };
            for (const run of runs.data.workflow_runs) {
              if (
                run.id !== context.runId &&
                !(await usesMergedConcurrency(run)) &&
                (run.status === 'in_progress' || run.status === 'queued')
              ) {
                await github.rest.actions.cancelWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
              }
            }
